# Fork addition: checks on pull requests and on main.
name: CI

on:
  # Feature branches are checked through their pull request; pushing to the
  # branch alone would run the same checks a second time.
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR or branch makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mocked node)
        run: npm run e2e
