# Fork addition: build a container image, push it to GHCR and roll it out on our
# server with docker compose. Uses its own DOCKER_DEPLOY_* secrets so it can
# never be confused with upstream's rsync-based deploy.yml.
name: Deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  build:
    # Only in the fork; never runs in (or for) the upstream repository.
    if: github.repository == 'MichZNN/nom-webwallet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install, check and test
        run: |
          npm ci
          npm audit --audit-level=critical
          npm run typecheck
          npm test

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 servers and arm64 ones (e.g. Ampere, Raspberry Pi, Graviton)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DOCKER_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo 'DOCKER_DEPLOY_SSH_KEY is not set'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'DOCKER_DEPLOY_KNOWN_HOSTS is not set'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart on the server
        env:
          SSH_HOST: ${{ secrets.DOCKER_DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DOCKER_DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DOCKER_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DOCKER_DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in SSH_HOST SSH_USER DEPLOY_PATH; do
            test -n "${!v}" || { echo "secret for $v is not set"; exit 1; }
          done
          # The short-lived GITHUB_TOKEN goes over stdin, so it never shows up in
          # the server's process list or shell history.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$DEPLOY_PATH'
             docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
             trap 'docker logout ghcr.io >/dev/null' EXIT
             NOM_WEBWALLET_IMAGE='$IMAGE' docker compose pull
             NOM_WEBWALLET_IMAGE='$IMAGE' docker compose up -d --remove-orphans
             docker image prune -f >/dev/null"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
