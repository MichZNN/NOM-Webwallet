# Included in every location: nginx drops server-level add_header directives in
# any location that sets its own add_header, so the headers live in one snippet.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# connect-src: Zenon nodes (wss:), the plasma bot, and WalletConnect's relay/verify services.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; worker-src 'self'; connect-src 'self' wss: https://plazma.bot https://*.walletconnect.org https://*.walletconnect.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
# Required for SharedArrayBuffer (in-browser PoW)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
