# Headers for /pow-worker.js only. A dedicated worker runs under the CSP of its
# own response, and the SDK's emscripten PoW module needs 'unsafe-eval' at init.
# Allowing it here keeps it off the wallet page itself.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self';" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control "no-cache" always;
