# Plain HTTP on 8080: TLS is terminated by the reverse proxy in front of this
# container (Caddy, Traefik, nginx-proxy, ...). A wallet must only be served over HTTPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The PoW worker gets its own CSP (see pow-worker-headers.conf)
    location = /pow-worker.js {
        include /etc/nginx/snippets/pow-worker-headers.conf;
        try_files $uri =404;
    }

    # PoW worker files keep fixed names, so revalidate them
    location ~ ^/pow\.(js|wasm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA routing; index.html must never be cached or users keep an old build
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
